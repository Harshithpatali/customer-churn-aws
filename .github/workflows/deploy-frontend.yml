name: Deploy Frontend to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: customer-churn-frontend
  ECS_SERVICE: customer-churn-frontend-2167
  ECS_CLUSTER: default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile.frontend \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$ECR_REPOSITORY:latest \
            .

          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS Express Mode
        env:
          AWS_ACCOUNT_ID: "870140859723"
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          echo "Deploying image:"
          echo "$IMAGE_URI"

          aws ecs update-express-gateway-service \
            --service-arn "arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:service/default/${ECS_SERVICE}" \
            --region "$AWS_REGION" \
            --primary-container "{\"image\":\"${IMAGE_URI}\"}"

      - name: Verify ECS Express Mode deployment
        env:
          AWS_ACCOUNT_ID: "870140859723"
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          EXPECTED_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          echo "Expected active image:"
          echo "$EXPECTED_IMAGE"

          for i in {1..30}; do
            ACTIVE_IMAGE=$(aws ecs describe-express-gateway-service \
              --service-arn "arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:service/default/${ECS_SERVICE}" \
              --region "$AWS_REGION" \
              --query 'service.activeConfigurations[0].primaryContainer.image' \
              --output text)

            echo "Active image:"
            echo "$ACTIVE_IMAGE"

            if [ "$ACTIVE_IMAGE" = "$EXPECTED_IMAGE" ]; then
              echo "ECS Express Mode deployment verified successfully."
              exit 0
            fi

            echo "Waiting for ECS Express Mode to activate the new revision..."
            sleep 10
          done

          echo "ERROR: ECS Express Mode deployment verification timed out."
          exit 1
